services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tuchi
      POSTGRES_PASSWORD: tuchi_dev
      POSTGRES_DB: tuchi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuchi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://tuchi:tuchi_dev@postgres:5432/tuchi
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-in-production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_VL_MODEL: ${OLLAMA_VL_MODEL:-qwen3-vl:4b}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      VIETOCR_ENABLED: ${VIETOCR_ENABLED:-true}
      VIETOCR_MODEL: ${VIETOCR_MODEL:-vgg_seq2seq}
      VIETOCR_DEVICE: ${VIETOCR_DEVICE:-}
      VIETOCR_MAX_IMAGE_WIDTH: ${VIETOCR_MAX_IMAGE_WIDTH:-1600}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      USE_SENTENCE_EMBEDDINGS: ${USE_SENTENCE_EMBEDDINGS:-false}
      VINTERN_API_URL: ${VINTERN_API_URL:-}
      VINTERN_API_KEY: ${VINTERN_API_KEY:-}
      VINTERN_MODEL_NAME: ${VINTERN_MODEL_NAME:-vintern-1b}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
    volumes:
      - ./backend:/app
      - receipt_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://tuchi:tuchi_dev@postgres:5432/tuchi
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app worker --loglevel=info

  beat:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://tuchi:tuchi_dev@postgres:5432/tuchi
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app beat --loglevel=info

volumes:
  postgres_data:
  receipt_uploads:
